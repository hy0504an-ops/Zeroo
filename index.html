<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 카톡·네이버·인스타 등 앱 안 브라우저로 열리면 크롬으로 다시 열기 (일반 웹주소에서만 동작) */
(function(){
  try{
    if(!/^https?:$/.test(location.protocol))return;
    var ua=navigator.userAgent||'',url=location.href;
    if(/[?&]nochrome=1/.test(location.search))return;
    if(!/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps/i.test(ua))return;
    var plain=url.replace(/^https?:\/\//,'');
    var back=url+(url.indexOf('?')>-1?'&':'?')+'nochrome=1';
    if(/android/i.test(ua)){
      location.href='intent://'+plain+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(back)+';end';
    }else if(/iphone|ipad|ipod/i.test(ua)){
      if(/KAKAOTALK/i.test(ua))location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);
      else location.href='googlechromes://'+plain;
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 아이폰 16</title>
<style>
:root{--sub:rgba(255,255,255,.6);--blue:#0a84ff;--green:#30d158;--line:rgba(255,255,255,.12);--card:#1c1d1c;--glass:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"SamsungOne","Noto Sans KR","Apple SD Gothic Neo",-apple-system,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block;fill:currentColor}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:#000;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-weight:600;font-size:15px;flex:none}
/* 잠금 */
.clock{text-align:center;margin-top:36px}
.clock .d{font-size:18px;color:var(--sub)}
.clock .t{font-size:76px;font-weight:300;letter-spacing:-2px}
.pass{margin:auto;text-align:center;width:100%}
.pass h2{font-size:18px;font-weight:500;margin:0 0 18px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:28px;min-height:14px}
.dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}
.dots i.f{background:#fff}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{height:76px;border-radius:50%;background:#1c1c1e;font-size:30px;font-weight:300;line-height:1.1}
.pad small{display:block;font-size:10px;letter-spacing:2px;color:var(--sub)}
.pad button:active{background:#4a4a4d}
.pad .ghost{background:none;font-size:18px}
.lockfoot{display:flex;justify-content:space-between;padding:16px 40px 20px;color:var(--sub);font-size:20px}
/* 홈 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:34px 18px 10px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;width:76px}
.ic{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-size:30px}
.dock{margin:auto 14px 12px;padding:14px;border-radius:30px;background:var(--glass);backdrop-filter:blur(20px);display:flex;justify-content:space-around}
.dock .app{width:auto}
.home-hint{text-align:center;color:var(--sub);font-size:12px;padding-bottom:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(60,60,64,.95);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.on{opacity:1}
/* 전화 앱 (삼성 스타일) */
.back{padding:6px 22px;color:var(--blue);font-size:16px;text-align:left;flex:none}
.tab{display:none;flex:1;flex-direction:column;min-height:0}
.tab.on{display:flex}
.hdr{flex:none;text-align:center;padding:34px 0 6px}
.hdr h1{margin:0;font-size:32px;font-weight:700}
.hdr p{margin:8px 0 0;color:var(--sub);font-size:15px}
.tools{display:flex;justify-content:flex-end;gap:26px;padding:10px 28px 12px;flex:none}
.tools svg{width:26px;height:26px}
.scroll{flex:1;overflow-y:auto;padding:0 14px 18px}
.card{background:var(--card);border-radius:26px;overflow:hidden;margin-bottom:6px}
.banner{padding:18px 22px 12px;font-size:15px;line-height:1.5}
.banner .acts{display:flex;justify-content:flex-end;gap:30px;padding:10px 4px 2px;font-weight:700}
.banner .acc{display:flex;align-items:center;gap:14px;margin-top:12px;color:#ddd}
.banner .acc i{width:34px;height:34px;border-radius:10px;background:#2f5bff;display:block}
.grp{padding:16px 12px 8px;font-size:13px;color:#cfcfcf;display:flex;align-items:center;gap:10px}
.grp svg{width:20px;height:20px;color:#ccc}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:0 20px;min-height:64px;text-align:left;position:relative}
.row:active{background:#2b2c2b}
.row + .row::before{content:"";position:absolute;top:0;left:78px;right:20px;border-top:1px solid #333}
.row .n{font-size:18px}
.row .w{margin-left:auto;color:#bbb;font-size:14px;white-space:nowrap}
.row .ci{width:34px;display:grid;place-items:center;color:#cfd2cf;position:relative;flex:none}
.row .ci svg{width:24px;height:24px}
.row .ci b{position:absolute;top:-6px;right:0;font-size:12px}
.row.missed .n,.row.missed .ci{color:#ff6b5e}
.row.recent .row .n{font-size:18px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;flex:none}
.crow{min-height:68px}
.crow + .crow::before{left:84px}
/* 키패드 */
.disp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px 18px;min-height:0}
.disp .num{font-size:38px;font-weight:300;word-break:break-all;text-align:center;letter-spacing:1px}

.kp{display:grid;grid-template-columns:repeat(3,1fr);max-width:380px;width:100%;margin:0 auto;row-gap:6px;flex:none}

.kbot{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;max-width:380px;width:100%;margin:10px auto 12px;flex:none}
.callbtn{grid-column:2;justify-self:center;width:86px;height:86px;border-radius:50%;background:#a9b2a5;color:#fff;display:grid;place-items:center;position:relative;opacity:.65}
.callbtn.on{opacity:1;background:#3fbf6a}
.callbtn svg{width:40px;height:40px}
.callbtn span{position:absolute;top:22px;right:22px;font-size:13px;font-weight:800}
.del{grid-column:3;justify-self:center;font-size:28px;color:#ddd;visibility:hidden}
.del.on{visibility:visible}
.tabbar{display:flex;flex:none;background:#000;padding-top:6px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--sub);padding:8px 0}
.tabbar button svg{width:30px;height:30px}
.tabbar button.on{color:#fff;font-weight:700}
.homebar{width:130px;height:5px;border-radius:3px;background:#d0d0d0;margin:6px auto 4px;flex:none}
/* 통화 중 */
#incall{background:linear-gradient(#0f2a30,#0e1c1f 55%,#0b1416);align-items:center}
.ictop{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;font-size:17px;position:relative;width:100%}
.ictop svg{width:20px;height:20px}
.ictop .rc{display:flex;align-items:center;gap:6px;color:#e6f5ea}
.ictop .dot{width:9px;height:9px;border-radius:50%;background:#7ee0a0}
.ictop .sep{color:var(--sub)}
.icname{margin-top:60px;font-size:38px;font-weight:700;text-align:center;padding:0 20px}
.icnum{margin-top:8px;color:#9fb3b7;font-size:17px;text-align:center}
.vol{position:absolute;right:16px;top:230px;width:62px;height:180px;border-radius:30px;background:#2a2e30;overflow:hidden}
.vol i{position:absolute;left:0;right:0;bottom:0;height:55%;background:#6b6f70}
.vol em{position:absolute;top:10px;left:0;right:0;text-align:center;font-style:normal;letter-spacing:2px;font-weight:700}
.panel{margin:auto 0 0;width:calc(100% - 28px);background:#060c0d;border-radius:28px;padding:34px 12px 26px;display:flex;flex-direction:column;align-items:center;gap:26px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:34px;width:100%}
.pgrid button{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:13px}
.pgrid .pi{width:40px;height:40px;display:grid;place-items:center}
.pgrid .pi svg{width:36px;height:36px}
.pgrid button.act .pi{color:#3fd47a}
.pgrid .rbox{width:38px;height:38px;border-radius:8px;background:#1fa35a;display:grid;place-items:center}
.pgrid .rbox svg{width:26px;height:26px}

.icstat{margin-top:6px;color:#9fb3b7;font-size:14px;min-height:20px}
/* 음성 메모 */
.bar{display:flex;align-items:center;padding:6px 18px}
.bar.t2 h1{font-size:34px;margin:0}
.stage{display:flex;flex-direction:column;align-items:center;padding:14px 0 18px}
canvas{width:100%;height:80px;display:block}
.timer{font-size:44px;font-weight:200;font-variant-numeric:tabular-nums;margin:6px 0 16px}

/* 알림 배너 */
.notif{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;background:rgba(48,48,52,.96);backdrop-filter:blur(16px);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-160%);transition:transform .35s;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.badge.on{display:grid}
.ic{position:relative}

.cview{display:none;flex:1;flex-direction:column;min-height:0}
.cview.on{display:flex}

/* 카메라 */
#camv{flex:1;min-height:0;width:100%;object-fit:cover;background:#111}

/* 갤러리 */
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px 14px}
.gg div{aspect-ratio:1;background:#222 center/cover}

.dtxt{width:calc(100% - 28px);margin:6px 14px;background:#1c1c1e;color:#fff;border:0;border-radius:16px;padding:14px;font:inherit;font-size:16px;min-height:110px;resize:none;outline:0}
.drow{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 10px}

.drow .mic{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px}
.rec.sm{width:44px;height:44px;border-width:2px}

.rec.sm.live span{width:16px;height:16px;border-radius:4px}
.dent{padding:14px 18px;border-bottom:1px solid var(--line)}
.dent .dd{font-size:13px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between}
.dent .dd button{color:var(--blue)}
.dent p{margin:0;white-space:pre-wrap;line-height:1.5}
.dent audio{width:100%;height:36px;margin-top:8px}

.kp button{height:clamp(58px,10vh,96px)}

.kbot{margin:6px auto 10px}
.tabbar{border-top:1px solid #262626;margin-top:6px;padding-bottom:2px;position:relative;z-index:2;background:#000}

.tv.on{display:flex}

.chips{display:flex;gap:10px;padding:8px 20px 12px;overflow-x:auto;flex:none}

.chip.on{background:#f2f2f2;color:#111;font-weight:600}

.kav{width:60px;height:60px;border-radius:24px;display:grid;place-items:center;flex:none;overflow:hidden}

.sring{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.sring.me{background:#333}
.sin{width:100%;height:100%;border-radius:50%;border:3px solid #000;display:grid;place-items:center;font-size:20px;font-weight:700}
.ig-post{padding-bottom:14px}
.ig-ph{display:flex;align-items:center;gap:10px;padding:8px 14px;font-weight:600;font-size:14px}
.ig-ph .sin{width:34px;height:34px;border:0;font-size:13px}
.ig-img{aspect-ratio:1;display:grid;place-items:center;font-size:90px}
.ig-act{display:flex;gap:18px;padding:10px 14px 4px;font-size:25px}
.ig-act .liked{color:#ff3040}
.ig-lk{padding:0 14px;font-weight:600;font-size:14px}
.ig-cp{padding:4px 14px 0;font-size:14px;line-height:1.4}
.ig-nav{display:flex;border-top:1px solid #1c1c1c;flex:none;padding:8px 0 2px;background:#000}
.ig-nav button{flex:1;display:grid;place-items:center;font-size:26px;padding:6px 0;opacity:.55}
.ig-nav button.on{opacity:1}
.ig-prof{padding:12px 18px}
.ig-pr1{display:flex;align-items:center;gap:22px}
.ig-pr1 .sring{width:86px;height:86px;flex:none}
.ig-stat{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:13px}
.ig-stat b{display:block;font-size:18px}
.ig-btn{margin-top:14px;background:#262626;border-radius:10px;text-align:center;padding:9px;font-weight:600;font-size:14px;width:100%}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:14px}
.ig-grid div{aspect-ratio:1;background:#222 center/cover}
.gd{padding:16px 14px 8px;font-size:15px;font-weight:600}

.sr{display:flex;align-items:center;gap:7px}
.sr svg{width:17px;height:17px;fill:#fff}
.sr .w6{font-size:7px;line-height:7px;font-weight:700;margin-left:-4px;text-align:center}
.sr .bat{display:flex;align-items:center;gap:3px;border-radius:13px;padding:1px 9px 1px 6px;font-size:14px;font-weight:800;color:#111;background:#c4c4c4}
.sr .bat svg{width:14px;height:14px;fill:#111}
/* 수신 전화 */
#ring{background:linear-gradient(#17262c,#0b1114);align-items:center}
.rl{margin-top:70px;color:#9fb3b7;font-size:16px;text-align:center}
.rn{margin-top:14px;font-size:42px;font-weight:700;text-align:center}
.rnum{margin-top:6px;color:#9fb3b7;font-size:17px;text-align:center;min-height:22px}
.rav{width:120px;height:120px;border-radius:50%;background:linear-gradient(160deg,#8cc3ff,#4c8df0);display:grid;place-items:center;margin:34px auto 0;animation:rp 1.2s infinite}
.rav svg{width:70px;height:70px;fill:#fff}
@keyframes rp{50%{box-shadow:0 0 0 18px rgba(140,195,255,.15)}}
.rbtns{margin-top:auto;display:flex;justify-content:space-around;width:100%;padding:0 40px 14px}
.rb{width:78px;height:78px;border-radius:50%;display:grid;place-items:center}
.rb svg{width:38px;height:38px;fill:#fff}
.rb.dec{background:#e5453b}.rb.dec svg{transform:rotate(135deg)}
.rb.acc{background:#30d158;animation:sw 1s infinite alternate}
@keyframes sw{to{transform:translateY(-10px)}}
.rcap{display:flex;justify-content:space-around;width:100%;padding:0 40px calc(40px + env(safe-area-inset-bottom,0px));color:#cfd8da;font-size:14px}
/* 안심위치 */
.mapw{margin:6px 14px;border-radius:22px;overflow:hidden;position:relative;background:#1b222c}
.mapw svg{width:100%;display:block}
#tme{position:absolute;left:52%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#2b7cff;border:3px solid #fff;transition:all 2.5s linear}
#tme::after{content:"";position:absolute;inset:-18px;border-radius:50%;background:rgba(43,124,255,.25);animation:pg 1.8s infinite}
@keyframes pg{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tcard{margin:10px 14px;background:#1c1d1c;border-radius:20px;padding:16px 18px;line-height:1.6;font-size:15px}
.tcard h3{margin:0 0 6px;font-size:16px}
.tcard .ok{color:#3fd47a;font-weight:700}
.tcard .row2{display:flex;justify-content:space-between;color:#cfcfcf;padding:7px 0;border-top:1px solid #2a2a2a;font-size:14px}
.tbtn{margin:6px 14px 16px;background:#2a2a2c;border-radius:14px;padding:14px;text-align:center;font-weight:600}

/* 카톡 대화창 (그룹 말풍선) */
.talk .msgs{background:#0a0a0a;padding:14px 14px 10px;gap:0}
.km{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.km.first{margin-top:16px}
.km.me{justify-content:flex-end}
.kav.xs{width:38px;height:38px;border-radius:15px}
.kav.xs svg{width:22px;height:22px}
.kc{display:flex;flex-direction:column;min-width:0;max-width:78%}
.km.me .kc{align-items:flex-end}
.kn{font-size:13px;color:#bdbdbd;margin:0 0 6px 2px}
.kr{display:flex;align-items:flex-end;gap:7px}
.km.me .kr{flex-direction:row-reverse}
.kb{position:relative;padding:11px 17px;border-radius:21px;font-size:17px;line-height:1.35;background:#2e2e30;color:#fff;white-space:pre-wrap;word-break:break-word}
.km.me .kb{background:#fee500;color:#111}
.km:not(.me).first .kb{border-top-left-radius:6px}
.km.me.first .kb{border-top-right-radius:6px}
.km:not(.me).first .kb::after{content:"";position:absolute;left:-6px;top:0;width:14px;height:14px;background:#2e2e30;clip-path:polygon(100% 0,0 0,100% 100%)}
.km.me.first .kb::after{content:"";position:absolute;right:-6px;top:0;width:14px;height:14px;background:#fee500;clip-path:polygon(0 0,100% 0,0 100%)}
.kt{font-size:12px;color:#9a9a9a;white-space:nowrap;padding-bottom:2px}
.notif{touch-action:pan-y;user-select:none}
.icscript{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:10px 26px;min-height:0;overflow:hidden;text-align:center}
.icl{font-size:19px;line-height:1.45;animation:fi .5s both;max-width:100%;word-break:keep-all}
.icl b{margin-right:4px;color:#ffb3b3}
.icl.fa{color:#fff;font-weight:700}
.icl.mine{color:#9fb3b7}.icl.mine b{color:#9fb3b7}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#incall .status,#ring .status{align-self:stretch;width:100%}
#tfa{position:absolute;left:10%;top:14%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#ff453a;border:3px solid #fff;transition:all 2s linear}
#tfa::after{content:"";position:absolute;inset:-18px;border-radius:50%;background:rgba(255,69,58,.25);animation:pg 1.4s infinite}

/* 잠금: 시간 → 쓸어 올리면 암호 */
.lkv{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 40px);display:flex;flex-direction:column;transition:transform .45s ease,opacity .45s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#lk1{touch-action:none}
#lk2{opacity:0;transform:translateY(70px);pointer-events:none}
#lock.up #lk1{opacity:0;transform:translateY(-70px);pointer-events:none}
#lock.up #lk2{opacity:1;transform:none;pointer-events:auto}
.lkhint{color:var(--sub);font-size:14px;text-align:center;padding:4px 0 22px;animation:hb 2s infinite}
@keyframes hb{50%{transform:translateY(-6px);opacity:.6}}
.clock .t{font-size:92px}
/* 홈 바 */
.back{display:none!important}
.homebar{display:none!important}
#homebar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:220px;height:calc(28px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;justify-content:center;padding-top:6px;touch-action:none}
#homebar i{width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.88);display:block}
body[data-screen="lock"] #homebar,body[data-screen="home"] #homebar,body[data-screen="ring"] #homebar,body[data-screen="incall"] #homebar{display:none}
body:not([data-screen="lock"]):not([data-screen="home"]):not([data-screen="ring"]):not([data-screen="incall"]) .screen{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
</style>
</head>
