<script>
/* 파일이 일부만 올라갔거나 오류가 있을 때만 아래에 안내가 떠요 */
(function(){
  var msgs=[];
  function box(t){var d=document.getElementById('dbgbox');if(!d){d=document.createElement('div');d.id='dbgbox';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#5a1414;color:#fff;font:12px/1.5 sans-serif;padding:10px 12px;white-space:pre-wrap;max-height:45%;overflow:auto';(document.body||document.documentElement).appendChild(d)}d.textContent=t}
  window.addEventListener('error',function(e){msgs.push((e.message||'error')+(e.lineno?' (줄 '+e.lineno+')':''))});
  setTimeout(function(){if(!window.__ok)box('페이지가 끝까지 실행되지 않았어요.\nindex.html을 다시 올린 뒤 새로고침해 주세요.'+(msgs.length?'\n\n'+msgs.join('\n'):''))},3000);
})();
</script>
<script>
/* 카톡·네이버·인스타 등 앱 안 브라우저로 열리면 크롬으로 다시 열기 (일반 웹주소에서만 동작) */
(function(){
  try{
    if(!/^https?:$/.test(location.protocol))return;
    var ua=navigator.userAgent||'',url=location.href;
    if(/[?&]nochrome=1/.test(location.search))return;
    if(!/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps/i.test(ua))return;
    var plain=url.replace(/^https?:\/\//,'');
    var back=url+(url.indexOf('?')>-1?'&':'?')+'nochrome=1';
    if(/android/i.test(ua)){
      location.href='intent://'+plain+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(back)+';end';
    }else if(/iphone|ipad|ipod/i.test(ua)){
      if(/KAKAOTALK/i.test(ua))location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);
      else location.href='googlechromes://'+plain;
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 아이폰 16</title>
<style>
:root{--sub:rgba(255,255,255,.6);--blue:#0a84ff;--green:#30d158;--line:rgba(255,255,255,.12);--card:#1c1d1c;--glass:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"SamsungOne","Noto Sans KR","Apple SD Gothic Neo",-apple-system,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block;fill:currentColor}

.screen.on{display:flex}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-weight:600;font-size:15px;flex:none}
/* 잠금 */
.clock{text-align:center;margin-top:36px}
.clock .d{font-size:18px;color:var(--sub)}
.clock .t{font-size:76px;font-weight:300;letter-spacing:-2px}

.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}

.pad small{display:block;font-size:10px;letter-spacing:2px;color:var(--sub)}
.pad button:active{background:#4a4a4d}

.lockfoot{display:flex;justify-content:space-between;padding:16px 40px 20px;color:var(--sub);font-size:20px}
/* 홈 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:34px 18px 10px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;width:76px}

/* 전화 앱 (삼성 스타일) */

function startCall(num,noReal){

  $('#cname').textContent=nm||num;$('#cnum').textContent=nm?num:'';
  csec=0;rsec=0;recOn=true;$('#ctime').textContent='00:00';$('#rtime').textContent='00:00';

  $('#cstat').textContent='연결 중…';
  document.querySelectorAll('.pgrid .tg').forEach(b=>b.classList.remove('act'));
  show('incall');clearInterval(ctid);
  if(digits(num)===digits(FATHER_NUM))playScript();else{stopScript();$('#icscript').innerHTML=''}

}

  const el=$('#'+id);
  el.innerHTML=`<div class="status"><span class="clk">9:41</span><span class="sr"></span></div>

  st.list=()=>{
    st.cur=-1;$('#'+id+'-l').classList.add('on');$('#'+id+'-t').classList.remove('on');
    $('#'+id+'-ls').innerHTML=st.data.map((c,i)=>{const l=c.msgs[c.msgs.length-1]||{t:'',time:''};
      return `<button class="crow2" data-ci="${i}">${avc(c.name)}<div class="tx"><div class="nm">${esc(c.name)}</div><div class="lm">${esc(l.t)}</div></div><div class="meta"><span>${l.time}</span>${c.unread?`<b>${c.unread}</b>`:''}</div></button>`}).join('');
    st.badge();
  };
  st.badge=()=>{const n=st.data.reduce((a,c)=>a+c.unread,0),bd=$('#bd-'+id);if(bd){bd.textContent=n;bd.classList.toggle('on',n>0)}};
  st.render=st.list;
  st.open=i=>{

    $('#'+id+'-h').textContent=c.name;st.draw();
    st.badge();
  };
  st.draw=()=>{
    const c=st.data[st.cur],m=$('#'+id+'-m');if(!c)return;

    m.scrollTop=m.scrollHeight;
  };
  st.send=()=>{const inp=$('#'+id+'-i'),v=inp.value.trim();if(!v||st.cur<0)return;
    st.data[st.cur].msgs.push({me:1,t:v,time:nowT()});inp.value='';st.draw();onSent(id,st.data[st.cur].name,v)};

  $('#'+id+'-b').onclick=st.list;$('#'+id+'-s').onclick=st.send;
  $('#'+id+'-i').onkeydown=e=>{if(e.key==='Enter')st.send()};
  st.list();
}

function draw(){
  const data=new Uint8Array(an.frequencyBinCount);an.getByteTimeDomainData(data);
  g.clearRect(0,0,cv.width,cv.height);
  const n=60,step=Math.floor(data.length/n),w=cv.width/n;g.fillStyle='#0a84ff';
  for(let i=0;i<n;i++){const v=Math.abs(data[i*step]-128)/128,h=Math.max(4,v*cv.height*1.6);g.fillRect(i*w+2,(cv.height-h)/2,w-5,h)}
  raf=requestAnimationFrame(draw);
}

  ctx=new (window.AudioContext||window.webkitAudioContext)();
  an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
  rec=new MediaRecorder(stream);chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{pendingAudio=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));$('#rstate').textContent='녹음 완료 · 저장을 눌러 일기에 남겨요'};
  rec.start();btn.classList.add('live');$('#rstate').textContent='녹음 중…';draw();
}

function autoReply(app,name){
  const st=CH[app],i=st.data.findIndex(c=>c.name===name);if(i<0)return;
  const t=AUTO_REPLIES.find(x=>!said.has('나|'+x));if(!t)return;said.add('나|'+t);
  st.data[i].msgs.push({me:1,t,time:nowT()});
  if(st.cur===i&&$('#'+app).classList.contains('on'))st.draw();else if(st.cur<0)st.render();
}

/* ===== 알림 왼쪽으로 밀어 없애기 ===== */
(function(){
  const n=$('#notif');let x0=null,dx=0;
  n.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;n.style.transition='none'});
  n.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(dx<0)n.style.transform='translateX('+dx+'px)'});
  const end=()=>{
    if(x0===null)return;
    swiped=Math.abs(dx)>8;n.style.transition='';
    if(dx<-70){
      n.style.transform='translateX(-120%)';clearTimeout(nt2);pend=null;
      setTimeout(()=>{n.style.transition='none';n.classList.remove('on');n.style.transform='';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.transition=''}))},250);
    }else n.style.transform='';
    x0=null;setTimeout(()=>{swiped=false},120);
  };
  n.addEventListener('pointerup',end);n.addEventListener('pointercancel',end);
})();

/* ===== 통화 중 카톡 보류 / 통화 대사 ===== */
let fq=[];
const callBusy=()=>$('#ring').classList.contains('on')||$('#incall').classList.contains('on');
function flushFatherQ(){const q=fq;fq=[];q.forEach((m,k)=>setTimeout(()=>incoming(m[0],m[1],m[2]),1500+k*2200))}
let scriptT=[],scriptN=0;
function stopScript(){scriptT.forEach(clearTimeout);scriptT=[]}
const sIdx={};
function playScript(){
  stopScript();const box=$('#icscript');box.innerHTML='';
  let key,pool;
  if(stage>=2){key='p2';pool=CALL_POOLS[2]}else if(anger>=2){key='an';pool=ANGRY_SCRIPTS}else{key='p'+stage;pool=CALL_POOLS[stage]}
  sIdx[key]=(key in sIdx?sIdx[key]:-1)+1;
  const sc=pool[sIdx[key]];if(!sc)return;
  sc.filter(l=>!said.has(l[0]+'|'+l[1])).forEach((l,k)=>scriptT.push(setTimeout(()=>{
    said.add(l[0]+'|'+l[1]);if(l[2])setStage(l[2]);
    const d=document.createElement('div');d.className='icl '+(l[0]==='나'?'mine':'fa');
    d.innerHTML='<b>'+esc(l[0])+' :</b> '+esc(l[1]);box.appendChild(d);
    while(box.children.length>5)box.removeChild(box.firstChild);
    if(navigator.vibrate&&l[0]!=='나')navigator.vibrate(120);
  },1500+k*2600)));
}

/* ===== 단어 반응 (아버지가 흥분) ===== */
let anger=0,dist=DIST_START;const sentAlert=new Set();
function reactTo(app,name,text){
  const t=(text||'').replace(/\s+/g,'');
  const rule=KEYWORD_RULES.find(r=>r.words.some(w=>t.includes(w.replace(/\s+/g,''))));
  if(!rule)return false;
  const rg=rule.rage||0;
  anger=Math.min(anger+rg,5);dist=Math.max(MIN_DIST,dist-rg*350);
  const cand=rule.replies.filter(r=>(r[1]<0||r[1]>=stage)&&!said.has(FATHER_NAME+'|'+r[0]));
  const n=Math.min(cand.length,(rule.n||2)+anger),gap=Math.max(550,1100-anger*130);
  let pick=cand.slice(0,n);
  if(rg>=2&&stage<1&&!pick.some(r=>r[1]>=1)){const c=cand.find(r=>r[1]>=1);if(c){pick=pick.slice(0,Math.max(0,n-1));pick.push(c)}}
  pick.forEach((r,k)=>setTimeout(()=>incoming(app,name,r[0]),700+k*gap));
  if(REPLY_BY_CALL||rg>=2)setTimeout(()=>{if(!callBusy())ringCall(FATHER_NUM)},700+pick.length*gap+1200);
  return true;
}

/* ===== 아버지가 다가옴 (안심위치 문자 + 지도) ===== */
const distText=()=>dist>=1000?(dist/1000).toFixed(1)+'km':(Math.round(dist/10)*10)+'m';
function tickDist(){
  dist=Math.max(MIN_DIST,dist-DIST_SPEED*2);
  const crossed=ALERTS.filter(a=>dist<=a[0]&&!sentAlert.has(a[0]));
  crossed.forEach(a=>sentAlert.add(a[0]));
  if(crossed.length)incoming('sms','안심위치',crossed[crossed.length-1][1]);
  const td=$('#tdist');if(td)td.textContent=distText();
  const f=$('#tfa');if(f){const p=1-(dist-MIN_DIST)/(DIST_START-MIN_DIST);f.style.left=(10+p*42)+'%';f.style.top=(14+p*36)+'%'}
  const ts=$('#tstat');if(ts)ts.textContent=dist<DIST_START-300?'아버지가 이쪽으로 오고 있어요!':'보호자가 위치를 확인하고 있어요';
}
tickDist();setInterval(tickDist,2000);

/* ===== 친구 반응 (살려줘 → 친구가 오고 있음) ===== */
const sosDone=new Set();
function friendReact(app,name,text){
  if(!SOS_FRIENDS.includes(name))return;
  const t=(text||'').replace(/\s+/g,'').toLowerCase();
  if(!sosDone.has(name)&&SOS_WORDS.some(w=>t.includes(w))){
    sosDone.add(name);SOS_FLOW.forEach(([d,m])=>setTimeout(()=>incoming(app,name,m),d*1000));return;
  }
  const r=FRIEND_RULES.find(x=>x.words.some(w=>t.includes(w)));
  if(r)setTimeout(()=>incoming(app,name,r.reply),1600);
}

/* ===== 잠금 화면 쓸어 올리기 + 홈 바 ===== */
(function(){
  const L=$('#lock');let y0=null;
  L.addEventListener('pointerdown',e=>{y0=e.clientY});

  L.addEventListener('pointerup',()=>{y0=null});
  L.addEventListener('wheel',e=>{if(e.deltaY>10)L.classList.add('up')},{passive:true});
  $('#lkhint').onclick=()=>L.classList.add('up');
  $('#lkcancel').onclick=()=>{code='';paint();L.classList.remove('up')};
  const hb=$('#homebar');let hy=null;
  hb.addEventListener('pointerdown',e=>{hy=e.clientY});
  hb.addEventListener('pointerup',()=>{if(hy!==null){hy=null;go('home')}});
  hb.addEventListener('pointercancel',()=>{hy=null});
})();

/* ===== 이야기 단계 (카톡과 전화의 말을 맞춤) ===== */
let stage=0;const said=new Set(),LS=new Map();
FATHER_TEXTS.forEach(x=>LS.set(x[2],x[1]));
KEYWORD_RULES.forEach(r=>r.replies.forEach(x=>LS.set(x[0],x[1])));
FATHER_REPLIES.forEach(x=>LS.set(x[0],x[1]));
function setStage(v){if(v>stage){stage=v;dist=Math.min(dist,[9999,1400,350][v]||350)}}
window.__ok=1;
